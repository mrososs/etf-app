<section class="reset-password">
  <app-carusol-gallery></app-carusol-gallery>
  <div class="hero_text">
    <div class="login-container">
      <div class="d-flex justify-content-center align-items-center mb-4">
        <h1>{{ "login.titlechangePassword" | translate }}</h1>
      </div>
      <div class="contact-us__form">
        <form
          [formGroup]="resetPasswordForm"
          (ngSubmit)="onSubmit()"
          novalidate
        >
          <div class="form-group">
            <label for="newPassword" class="form-label">
              {{ "login.newPassword" | translate }}
            </label>
            <div class="input-group">
              <input
                id="newPassword"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="newPassword"
                class="form-control"
                [class.ng-invalid]="password?.invalid && password?.touched"
                [class.ng-valid]="password?.valid"
                [placeholder]="'login.newPasswordPlaceholder' | translate"
                autocomplete="new-password"
                aria-describedby="passwordHelp passwordError"
              />
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="togglePassword()"
                [attr.aria-label]="
                  showPassword ? 'Hide password' : 'Show password'
                "
                tabindex="-1"
              >
                <i
                  class="fas"
                  [class.fa-eye]="!showPassword"
                  [class.fa-eye-slash]="showPassword"
                  [attr.aria-hidden]="true"
                ></i>
              </button>
            </div>

            <!-- Validation Messages -->
            <div
              id="passwordError"
              class="text-danger mt-2"
              *ngIf="password?.touched && password?.invalid"
              role="alert"
              aria-live="polite"
            >
              <small *ngIf="password?.errors?.['required']">
                {{ "login.errors.passwordRequired" | translate }}
              </small>
              <small *ngIf="password?.errors?.['minlength']">
                {{ "login.errors.passwordMinLength" | translate }}
              </small>
            </div>

            <!-- Help Text -->
            <div id="passwordHelp" class="form-text mt-1">
              <small class="text-muted">
                {{ "login.passwordHelp" | translate }}
              </small>
            </div>
          </div>

          <div class="mt-4">
            <button
              type="submit"
              class="news_btn w-100"
              [disabled]="
                resetPasswordForm.invalid || resetPasswordForm.pending
              "
            >
              <span *ngIf="!isLoading">
                {{ "login.changePassword" | translate }}
              </span>
              <span *ngIf="isLoading">
                <i class="fas fa-spinner fa-spin me-2"></i>
                {{ "login.changingPassword" | translate }}
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
