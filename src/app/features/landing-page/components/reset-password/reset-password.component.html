<section class="login">
  <app-carusol-gallery></app-carusol-gallery>
  <div class="hero_text">
    <div class="login-container">
      <div class="d-flex justify-content-center align-items-center">
        <h1>{{ "login.titlechangePassword" | translate }}</h1>
      </div>
      <div class="col-12 contact-us__form">
        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-12">
              <div class="form-group">
                <label for="email">{{ "login.userId" | translate }}</label>
                <input
                  id="email"
                  formControlName="userId"
                  type="text"
                  pInputText
                  placeholder="{{ 'login.userIdPlaceholder' | translate }}"
                  class="form-control"
                />
                <div
                  class="text-danger mt-1"
                  *ngIf="userId?.touched && userId?.invalid"
                >
                  <small *ngIf="userId?.errors?.['required']">
                    {{ "userId.errors.emailRequired" | translate }}
                  </small>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="form-group">
                <label for="email">{{ "login.token" | translate }}</label>
                <input
                  id="email"
                  formControlName="token"
                  type="text"
                  pInputText
                  placeholder="{{ 'login.tokenPlaceholder' | translate }}"
                  class="form-control"
                />
                <div
                  class="text-danger mt-1"
                  *ngIf="token?.touched && token?.invalid"
                >
                  <small *ngIf="token?.errors?.['required']">
                    {{ "userId.errors.emailRequired" | translate }}
                  </small>
                </div>
              </div>
            </div>
            <div class="col-12 mt-3">
              <div class="form-group">
                <label for="password">{{ "login.password" | translate }}</label>
                <input
                  id="password"
                  formControlName="newPassword"
                  type="password"
                  pInputText
                  placeholder="{{ 'login.passwordPlaceholder' | translate }}"
                  class="form-control"
                />

                <div
                  class="text-danger mt-1"
                  *ngIf="password?.touched && password?.invalid"
                >
                  <small *ngIf="password?.errors?.['required']">
                    {{ "login.errors.passwordRequired" | translate }}
                  </small>
                </div>
              </div>
            </div>

            <div class="mt-3">
              <button class="news_btn w-100" type="submit">
                {{ "login.changePassword" | translate }}
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
