<section class="room">
  <div class="w-100 room__image">
    <div class="room__overlay">
      <div class="room__text">
        <h1>{{ 'travelroom.title' | translate }}</h1>
        <nav class="breadcrumb">
          <a [routerLink]="['/landing-page/home']">{{ 'navbar.home' | translate }}</a>
          <span>&nbsp;>&nbsp;</span>
          <span>{{ 'travelroom.breadcrumb' | translate }}</span>
        </nav>
      </div>
    </div>
  </div>

  <div class="mt-5 container room__content">
    <div class="d-flex text-center text-lg-start justify-content-center align-items-center">
      <h1>{{ 'travelroom.header' | translate }}</h1>
    </div>

    <div class="mt-3">
      <div class="row text-center d-flex justify-content-center align-items-center">
        <div class="col-12 col-6 col-lg-6">
          <p class="mb-0 text-end">
            {{ 'travelroom.description' | translate }}
          </p>
        </div>
        <div class="col-12 col-6 col-lg-6">
          <img
            src="../../../../../../assets/img/rooms/Group 110.png"
            alt="logo"
            class="room_img"
          />
        </div>
      </div>
    </div>

    <div class="mt-5">
      <div class="d-flex justify-content-center align-items-center flex-column">
        <h1>{{ 'travelroom.officialSite.title' | translate }}</h1>
        <div class="mt-3">
          <span class="d-flex align-items-center gap-3">
            <img src="../../../../../../assets/svg/website.svg" alt="website" />
            <a href="https://www.etaa-egypt.org/" target="_blank">
              {{ 'travelroom.officialSite.link' | translate }}
            </a>
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
