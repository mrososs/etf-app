<section class="news">
  <!-- Header Section -->
  <div class="w-100 news__image">
    <div class="news__overlay">
      <div class="news__text">
        <h1>{{ "news.pageTitle" | translate }}</h1>
        <nav class="breadcrumb">
          <a [routerLink]="['/landing-page/home']">{{
            "news.breadcrumbHome" | translate
          }}</a>
          <span>&nbsp;>&nbsp;</span>
          <span>{{ "news.breadcrumbNews" | translate }}</span>
        </nav>
      </div>
    </div>
  </div>

  <!-- Union News Section -->
  <div class="news__mainNews mt-5">
    <div class="container">
      <h1>{{ "news.unionNewsTitle" | translate }}</h1>
      <div
        class="row justify-content-center text-center justify-content-lg-start"
      >
        <div
          class="col-12 col-sm-10 col-md-6 col-lg-4"
          *ngFor="let item of newsItems"
        >
          <div class="news-card d-flex flex-column align-items-center">
            <img
              [src]="getImageUrl(item.imageUrl)"
              alt="news"
              (error)="onImageError($event)"
            />
            <h1>{{ item.description }}</h1>
            <div class="d-flex gap-2 mt-2">
              <a
                [href]="generateFacebookShareLink(item.id, 'news')"
                target="_blank"
                class="btn btn-sm btn-outline-primary"
                aria-label="Share on Facebook"
              >
                <i
                  class="pi pi-facebook"
                  style="color: var(--color-primary)"
                ></i>
              </a>
              <a
                [href]="
                  generateTwitterShareLink(item.id, 'news', item.description)
                "
                target="_blank"
                class="btn btn-sm btn-outline-info"
                aria-label="Share on Twitter"
              >
                <i
                  class="pi pi-twitter"
                  style="color: var(--color-primary)"
                ></i>
              </a>
            </div>
            <button class="news_btn w-50 mt-2">
              <a
                [routerLink]="['/landing-page/newsdetails', item.id]"
                [queryParams]="{ type: 'news' }"
                class="text-white"
              >
                {{ item.buttonText || ("news.readMore" | translate) }}
              </a>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tourism News Section -->
  <div class="news__mainNews mt-5">
    <div class="container">
      <h1>{{ "news.tourismNewsTitle" | translate }}</h1>
      <div
        class="row justify-content-center text-center justify-content-lg-start"
      >
        <div
          class="col-12 col-sm-10 col-md-6 col-lg-4"
          *ngFor="let item of tourismNews"
        >
          <div class="news-card d-flex flex-column align-items-center">
            <img
              [src]="getImageUrl(item.imageUrl)"
              alt="news"
              (error)="onImageError($event)"
            />
            <h1>{{ item.description }}</h1>
            <div class="d-flex gap-2 mt-2">
              <a
                [href]="generateFacebookShareLink(item.id, 'touristnews')"
                target="_blank"
                class="btn btn-sm btn-outline-primary"
                aria-label="Share on Facebook"
              >
                <i
                  class="pi pi-facebook"
                  style="color: var(--color-primary)"
                ></i>
              </a>
              <a
                [href]="
                  generateTwitterShareLink(
                    item.id,
                    'touristnews',
                    item.description
                  )
                "
                target="_blank"
                class="btn btn-sm btn-outline-info"
                aria-label="Share on Twitter"
              >
                <i
                  class="pi pi-twitter"
                  style="color: var(--color-primary)"
                ></i>
              </a>
            </div>

            <button class="news_btn w-50 mt-2">
              <a
                [routerLink]="['/landing-page/newsdetails', item.id]"
                [queryParams]="{ type: 'touristnews' }"
                class="text-white"
              >
                {{ item.buttonText || ("news.readMore" | translate) }}
              </a>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
