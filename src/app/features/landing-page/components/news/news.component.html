<section class="news">
  <!-- Header Section -->
  <div class="w-100 news__image">
    <div class="news__overlay">
      <div class="news__text">
        <h1>{{ "news.pageTitle" | translate }}</h1>
        <nav class="breadcrumb">
          <a [routerLink]="['/landing-page/home']">{{
            "news.breadcrumbHome" | translate
          }}</a>
          <span>&nbsp;>&nbsp;</span>
          <span>{{ "news.breadcrumbNews" | translate }}</span>
        </nav>
      </div>
    </div>
  </div>

  <!-- Union News Section -->
  <div class="news__mainNews mt-5">
    <div class="container">
      <h1>{{ "news.unionNewsTitle" | translate }}</h1>
      <div
        class="row justify-content-center text-center justify-content-lg-start g-4"
      >
        <div
          class="col-12 col-sm-10 col-md-6 col-lg-4 mb-4"
          *ngFor="let item of newsItems"
        >
          <div class="news-card">
            <img
              [src]="getImageUrl(item.imageUrl)"
              alt="صورة الخبر"
              (error)="onImageError($event)"
            />
            <div class="news-content">
              <div class="news-text">
                <p>{{ item.description }}</p>
              </div>
              <div class="news-actions">
                <div class="social-buttons">
                  <a
                    [href]="generateFacebookShareLink(item.id, 'news')"
                    target="_blank"
                    aria-label="مشاركة على فيسبوك"
                    title="مشاركة على فيسبوك"
                  >
                    <i class="pi pi-facebook"></i>
                  </a>
                  <a
                    [href]="
                      generateTwitterShareLink(
                        item.id,
                        'news',
                        item.description
                      )
                    "
                    target="_blank"
                    aria-label="مشاركة على تويتر"
                    title="مشاركة على تويتر"
                  >
                    <i class="pi pi-twitter"></i>
                  </a>
                </div>
                <button class="news_btn">
                  <a
                    [routerLink]="['/landing-page/newsdetails', item.id]"
                    [queryParams]="{ type: 'news' }"
                  >
                    {{ item.buttonText || ("news.readMore" | translate) }}
                  </a>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tourism News Section -->
  <div class="news__mainNews mt-5">
    <div class="container">
      <h1>{{ "news.tourismNewsTitle" | translate }}</h1>
      <div
        class="row justify-content-center text-center justify-content-lg-start g-4"
      >
        <div
          class="col-12 col-sm-10 col-md-6 col-lg-4 mb-4"
          *ngFor="let item of tourismNews"
        >
          <div class="news-card">
            <img
              [src]="getImageUrl(item.imageUrl)"
              alt="صورة الخبر"
              (error)="onImageError($event)"
            />
            <div class="news-content">
              <div class="news-text">
                <p>{{ item.description }}</p>
              </div>
              <div class="news-actions">
                <div class="social-buttons">
                  <a
                    [href]="generateFacebookShareLink(item.id, 'touristnews')"
                    target="_blank"
                    aria-label="مشاركة على فيسبوك"
                    title="مشاركة على فيسبوك"
                  >
                    <i class="pi pi-facebook"></i>
                  </a>
                  <a
                    [href]="
                      generateTwitterShareLink(
                        item.id,
                        'touristnews',
                        item.description
                      )
                    "
                    target="_blank"
                    aria-label="مشاركة على تويتر"
                    title="مشاركة على تويتر"
                  >
                    <i class="pi pi-twitter"></i>
                  </a>
                </div>
                <button class="news_btn">
                  <a
                    [routerLink]="['/landing-page/newsdetails', item.id]"
                    [queryParams]="{ type: 'touristnews' }"
                  >
                    {{ item.buttonText || ("news.readMore" | translate) }}
                  </a>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
