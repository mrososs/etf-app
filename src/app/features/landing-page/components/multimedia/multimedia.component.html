<section class="multimedia">
  <!-- Hero Video Section -->
  <div class="hero-video-section">
    <div class="hero-video-container">
      <div class="hero-video-wrapper">
        <video
          [src]="safeVideoUrl"
          class="hero-video"
          [autoplay]="videoStarted"
          [muted]="isMuted"
          loop
          playsinline
          (error)="onVideoError()"
          (loadeddata)="onVideoLoaded()"
          #heroVideo
        >
          Your browser does not support the video tag.
        </video>
        <!-- Fallback background image -->
        <div
          class="hero-video-fallback"
          style="
            background-image: url('assets/img/trainingBackground.jpg');
            background-size: cover;
            background-position: center;
          "
        ></div>
      </div>
      <div
        class="hero-video-overlay"
        [ngClass]="{ 'fade-out': !showVideoOverlay }"
      >
        <div
          class="hero-video-content"
          [ngClass]="{ 'fade-out': !showHeroContent }"
        >
          <div class="hero-text-animation">
            <h1>{{ "multimedia.pageTitle" | translate }}</h1>
            <p class="hero-subtitle">
              {{ "multimedia.heroSubtitle" | translate }}
            </p>
          </div>
          <nav class="breadcrumb">
            <a [routerLink]="['/landing-page/home']">{{
              "multimedia.breadcrumbHome" | translate
            }}</a>
            <span>&nbsp;>&nbsp;</span>
            <span>{{ "multimedia.breadcrumbMultimedia" | translate }}</span>
          </nav>
        </div>
        <div
          class="scroll-indicator"
          [ngClass]="{ 'fade-out': !showHeroContent }"
        ></div>
      </div>
    </div>

    <!-- Mute/Unmute Button - Outside overlay to stay visible -->
    <div class="mute-button">
      <button
        class="mute-btn"
        (click)="toggleMute()"
        [attr.aria-label]="isMuted ? 'تشغيل الصوت' : 'كتم الصوت'"
        title="{{ isMuted ? 'تشغيل الصوت' : 'كتم الصوت' }}"
      >
        <i [class]="isMuted ? 'pi pi-volume-off' : 'pi pi-volume-up'"></i>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="multimedia__main mt-5">
    <div class="container">
      <!-- Category Filter Tabs -->
      <div class="row mb-4">
        <div class="col-12">
          <div class="category-tabs">
            <button
              *ngFor="let category of categories"
              class="category-tab"
              [class.active]="selectedCategory === category.key"
              (click)="filterByCategory(category.key)"
            >
              {{ category.label | translate }}
            </button>
          </div>
        </div>
      </div>

      <!-- Placeholder Content -->
      <div class="placeholder-content">
        <div class="placeholder-icon">
          <i class="pi pi-video"></i>
        </div>
        <h3 class="placeholder-title">
          {{ "multimedia.placeholder.title" | translate }}
        </h3>
        <p class="placeholder-message">
          {{ "multimedia.placeholder.message" | translate }}
        </p>
      </div>
    </div>
  </div>
</section>
