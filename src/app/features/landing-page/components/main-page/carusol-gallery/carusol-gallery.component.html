<div
  id="carouselExampleControls"
  class="carousel slide"
  data-bs-ride="carousel"
  role="region"
  aria-label="معرض الصور الرئيسي"
>
  <div class="carousel-indicators">
    <button
      type="button"
      data-bs-target="#carouselExampleControls"
      data-bs-slide-to="0"
      class="active"
      aria-current="true"
      aria-label="الصورة الأولى - معرض الإتحاد المصري للغرف السياحية"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleControls"
      data-bs-slide-to="1"
      aria-label="الصورة الثانية - معلومات عن الإتحاد"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleControls"
      data-bs-slide-to="2"
      aria-label="الصورة الثالثة - خدمات الإتحاد"
    ></button>
    <button
      type="button"
      data-bs-target="#carouselExampleControls"
      data-bs-slide-to="3"
      aria-label="الصورة الرابعة - أنشطة الإتحاد"
    ></button>
  </div>

  <div class="carousel-inner">
    <div class="carousel-item active">
      <img
        src="../../../../../../assets/img/carusol1.jpeg"
        class="d-block w-100"
        alt="صورة معرض الإتحاد المصري للغرف السياحية - عرض عام للخدمات السياحية"
      />
    </div>
    <div class="carousel-item">
      <img
        src="../../../../../../assets/img/aboutUnion.jpeg"
        class="d-block w-100"
        alt="صورة معلومات عن الإتحاد المصري للغرف السياحية - تاريخ وأهداف الإتحاد"
      />
    </div>
    <div class="carousel-item">
      <img
        src="../../../../../../assets/img/carusol2.jpeg"
        class="d-block w-100"
        alt="صورة خدمات الإتحاد المصري للغرف السياحية - التدريب والتطوير"
      />
    </div>
    <div class="carousel-item">
      <img
        src="../../../../../../assets/img/image 14.jpg"
        class="d-block w-100"
        alt="صورة أنشطة الإتحاد المصري للغرف السياحية - الفعاليات والمؤتمرات"
      />
    </div>
  </div>

  <button
    class="carousel-control-prev"
    type="button"
    data-bs-target="#carouselExampleControls"
    data-bs-slide="prev"
    aria-label="الصورة السابقة"
  >
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">الصورة السابقة</span>
  </button>
  <button
    class="carousel-control-next"
    type="button"
    data-bs-target="#carouselExampleControls"
    data-bs-slide="next"
    aria-label="الصورة التالية"
  >
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">الصورة التالية</span>
  </button>
</div>
